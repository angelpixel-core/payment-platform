services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-payment_sandbox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - payment-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-sandbox:
    build:
      context: ./apps/payment-sandbox
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/payment_sandbox?sslmode=disable}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    ports:
      - "${PAYMENT_SANDBOX_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  payment-platform-postgres:
