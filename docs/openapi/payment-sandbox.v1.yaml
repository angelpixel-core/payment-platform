openapi: 3.1.0
info:
  title: Payment Sandbox API
  version: v1
  description: Contract for integrating workflow consumers with the payment sandbox.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
security: []
servers:
  - url: /v1
paths:
  /payment_intents:
    post:
      operationId: createPaymentIntentV1
      summary: Create a payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
            example:
              amount: 1000
              currency: usd
              merchant_id: merchant_123
              customer_id: cus_123
              capture_method: manual
              idempotency_key: create-123
      responses:
        '400':
          description: Bad Request
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentResponse'
  /payment_intents/{id}/confirm:
    post:
      operationId: confirmPaymentIntentV1
      summary: Confirm a payment intent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Sandbox-Scenario
          in: header
          required: false
          schema:
            type: string
          description: Optional sandbox scenario override for deterministic behavior.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional idempotency key. The body field is also accepted as a fallback.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentIntentRequest'
            example:
              payment_method_token: pm_card_visa
              idempotency_key: confirm-123
      responses:
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPaymentIntentResponse'
  /payment_intents/{id}/capture:
    post:
      operationId: capturePaymentIntentV1
      summary: Capture a payment intent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        description: Optional capture overrides. Omit the body to capture the full remaining amount.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturePaymentIntentRequest'
            example:
              amount: 1000
              idempotency_key: capture-123
      responses:
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '200':
          description: Captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturePaymentIntentResponse'
  /refunds:
    post:
      operationId: createRefundV1
      summary: Create a refund
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional request idempotency key. The body field is also accepted as a fallback.
      requestBody:
        required: true
        description: Refund body. `charge_id` is required; `amount` and `idempotency_key` are optional.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            example:
              charge_id: ch_123
              amount: 1000
              idempotency_key: refund-123
      responses:
        '400':
          description: Bad Request
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
  /payment_attempts/{id}:
    get:
      operationId: getPaymentAttemptV1
      summary: Fetch payment attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptViewEnvelope'
  /charges/{id}:
    get:
      operationId: getChargeV1
      summary: Fetch charge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeViewEnvelope'
  /refunds/{id}:
    get:
      operationId: getRefundV1
      summary: Fetch refund
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundViewEnvelope'
  /payment_intents/{id}/lifecycle:
    get:
      operationId: getPaymentLifecycleV1
      summary: Fetch payment lifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLifecycleViewEnvelope'
  /payment_intents/{id}:
    get:
      operationId: getPaymentIntentV1
      summary: Fetch payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentViewEnvelope'
  /reports/transactions:
    get:
      operationId: getTransactionReportV1
      summary: Fetch transaction report
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReportEnvelope'
components:
  schemas:
    CreatePaymentIntentRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in the smallest currency unit.
        currency:
          type: string
          minLength: 1
          description: ISO currency code.
        merchant_id:
          type: string
          description: Optional merchant identifier.
        customer_id:
          type: string
          description: Optional customer identifier.
        capture_method:
          type: string
          enum: [manual, automatic]
          default: manual
        idempotency_key:
          type: string
          description: Optional request idempotency key.
    ConfirmPaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        payment_method_token:
          type: string
          description: Optional payment method token to drive the scenario.
        idempotency_key:
          type: string
          description: Optional request idempotency key fallback.
    CapturePaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Optional capture amount override. Omit to capture the full remaining amount.
        idempotency_key:
          type: string
          description: Optional request idempotency key. If omitted, the `Idempotency-Key` header is used when present.
    RefundRequest:
      type: object
      additionalProperties: false
      required: [charge_id]
      properties:
        charge_id:
          type: string
          description: Charge to refund.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Optional refund amount override. Omit to refund the remaining captured amount.
        idempotency_key:
          type: string
          description: Optional request idempotency key. If omitted, the `Idempotency-Key` header is used when present.
    PaymentIntentViewEnvelope:
      type: object
      additionalProperties: false
      required: [payment_intent]
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntentView'
    PaymentAttemptViewEnvelope:
      type: object
      additionalProperties: false
      required: [payment_attempt]
      properties:
        payment_attempt:
          $ref: '#/components/schemas/PaymentAttemptView'
    ChargeViewEnvelope:
      type: object
      additionalProperties: false
      required: [charge]
      properties:
        charge:
          $ref: '#/components/schemas/ChargeView'
    RefundViewEnvelope:
      type: object
      additionalProperties: false
      required: [refund]
      properties:
        refund:
          $ref: '#/components/schemas/RefundView'
    PaymentLifecycleViewEnvelope:
      type: object
      additionalProperties: false
      required: [payment_lifecycle]
      properties:
        payment_lifecycle:
          $ref: '#/components/schemas/PaymentLifecycleView'
    TransactionReportEnvelope:
      type: object
      additionalProperties: false
      required: [transactions_report]
      properties:
        transactions_report:
          $ref: '#/components/schemas/TransactionReportView'
    CreatePaymentIntentResponse:
      type: object
      additionalProperties: false
      required: [payment_intent]
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntentView'
    ConfirmPaymentIntentResponse:
      type: object
      additionalProperties: false
      required: [payment_intent, payment_attempt]
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntentView'
        payment_attempt:
          $ref: '#/components/schemas/PaymentAttemptView'
        charge:
          $ref: '#/components/schemas/ChargeView'
    CapturePaymentIntentResponse:
      type: object
      additionalProperties: false
      required: [payment_intent, charge]
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntentView'
        charge:
          $ref: '#/components/schemas/ChargeView'
    RefundResponse:
      type: object
      additionalProperties: false
      required: [refund, charge]
      properties:
        refund:
          $ref: '#/components/schemas/RefundView'
        charge:
          $ref: '#/components/schemas/ChargeView'
    PaymentIntentView:
      type: object
      additionalProperties: false
      required: [id, status, amount, currency, created_at, updated_at]
      properties:
        id:
          type: string
        merchant_id:
          type: string
        customer_id:
          type: string
        status:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        capture_method:
          type: string
        scenario:
          type: string
        idempotency_key:
          type: string
        charge_id:
          type: string
        latest_attempt_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentAttemptView:
      type: object
      additionalProperties: false
      required: [id, payment_intent_id, status, requested_at, responded_at]
      properties:
        id:
          type: string
        payment_intent_id:
          type: string
        payment_method_token:
          type: string
        status:
          type: string
        decline_code:
          type: string
        processor_reference:
          type: string
        requested_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
    ChargeView:
      type: object
      additionalProperties: false
      required: [id, payment_intent_id, amount, captured_amount, refunded_amount, status, created_at, updated_at]
      properties:
        id:
          type: string
        payment_intent_id:
          type: string
        payment_attempt_id:
          type: string
        amount:
          type: integer
          format: int64
        captured_amount:
          type: integer
          format: int64
        refunded_amount:
          type: integer
          format: int64
        status:
          type: string
        created_at:
          type: string
          format: date-time
        captured_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RefundView:
      type: object
      additionalProperties: false
      required: [id, charge_id, payment_intent_id, amount, status, created_at, updated_at]
      properties:
        id:
          type: string
        charge_id:
          type: string
        payment_intent_id:
          type: string
        amount:
          type: integer
          format: int64
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentLifecycleView:
      type: object
      additionalProperties: false
      required: [payment_intent, status, refundable_amount, is_refundable]
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntentView'
        latest_attempt:
          $ref: '#/components/schemas/PaymentAttemptView'
        charge:
          $ref: '#/components/schemas/ChargeView'
        status:
          type: string
        refundable_amount:
          type: integer
          format: int64
        is_refundable:
          type: boolean
    TransactionReportView:
      type: object
      additionalProperties: false
      required: [generated_at, transactions, balance_projection, settlement_projection, count]
      properties:
        generated_at:
          type: string
          format: date-time
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionReportLine'
        balance_projection:
          $ref: '#/components/schemas/BalanceProjectionView'
        settlement_projection:
          $ref: '#/components/schemas/SettlementProjectionView'
        count:
          type: integer
          format: int64
    TransactionReportLine:
      type: object
      additionalProperties: false
      required: [payment_intent]
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntentView'
        latest_attempt:
          $ref: '#/components/schemas/PaymentAttemptView'
        charge:
          $ref: '#/components/schemas/ChargeView'
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundView'
    BalanceProjectionView:
      type: object
      additionalProperties: false
      required: [generated_at, balances, count]
      properties:
        generated_at:
          type: string
          format: date-time
        balances:
          type: array
          items:
            $ref: '#/components/schemas/BalanceProjectionLine'
        count:
          type: integer
          format: int64
    BalanceProjectionLine:
      type: object
      additionalProperties: false
      required: [merchant_id, currency, account_type, amount, updated_at]
      properties:
        merchant_id:
          type: string
        currency:
          type: string
        account_type:
          type: string
          enum: [available, reserved, liquidable]
        amount:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
    SettlementProjectionView:
      type: object
      additionalProperties: false
      required: [generated_at, batches, count]
      properties:
        generated_at:
          type: string
          format: date-time
        batches:
          type: array
          items:
            $ref: '#/components/schemas/SettlementBatchLine'
        count:
          type: integer
          format: int64
    SettlementBatchLine:
      type: object
      additionalProperties: false
      required: [merchant_id, currency, settlement_date, status, gross_amount, refunded_amount, net_amount, charge_count, refund_count, charge_ids, charges, updated_at]
      properties:
        merchant_id:
          type: string
        currency:
          type: string
        settlement_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, ready]
        gross_amount:
          type: integer
          format: int64
        refunded_amount:
          type: integer
          format: int64
        net_amount:
          type: integer
          format: int64
        charge_count:
          type: integer
          format: int64
        refund_count:
          type: integer
          format: int64
        charge_ids:
          type: array
          items:
            type: string
        charges:
          type: array
          items:
            $ref: '#/components/schemas/SettlementChargeLine'
        updated_at:
          type: string
          format: date-time
    SettlementChargeLine:
      type: object
      additionalProperties: false
      required: [charge_id, payment_intent_id, captured_at, amount, refunded_amount]
      properties:
        charge_id:
          type: string
        payment_intent_id:
          type: string
        captured_at:
          type: string
          format: date-time
        amount:
          type: integer
          format: int64
        refunded_amount:
          type: integer
          format: int64
